<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#4f8aff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f8aff" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Backing -->
  <circle cx="256" cy="245" r="160" fill="url(#glowGrad)" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Outer Shield Outer Shell -->
  <polygon points="256,35 445,85 420,315 256,475 92,315 67,85"
           fill="#0b1324" stroke="url(#rimGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Inner Beveled Shield -->
  <polygon points="256,55 425,100 402,305 256,450 110,305 87,100"
           fill="url(#shieldGrad)" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Shaded Left Facet -->
  <polygon points="256,55 87,100 110,305 256,450" fill="#000000" opacity="0.25" />

  <!-- Concentric Tactical Radar Rings -->
  <circle cx="256" cy="245" r="140" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="245" r="95" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4" />
  <circle cx="256" cy="245" r="50" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.6" />

  <!-- Azimuth Crosshair Axes -->
  <line x1="116" y1="245" x2="396" y2="245" stroke="#4f8aff" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="4 4" />
  <line x1="256" y1="105" x2="256" y2="385" stroke="#4f8aff" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="4 4" />

  <!-- Neural Connection Pathways -->
  <line x1="256" y1="245" x2="160" y2="195" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7" />
  <line x1="256" y1="245" x2="352" y2="195" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7" />
  <line x1="256" y1="245" x2="186" y2="325" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7" />
  <line x1="256" y1="245" x2="326" y2="325" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7" />
  <line x1="256" y1="245" x2="256" y2="125" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7" />
  <line x1="256" y1="245" x2="256" y2="380" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Central Defense Reticle & Core -->
  <polygon points="256,170 331,245 256,320 181,245" fill="rgba(14,116,144,0.3)" stroke="#22d3ee" stroke-width="3.5" />
  <polygon points="256,200 301,245 256,290 211,245" fill="rgba(2,132,199,0.5)" stroke="#ffffff" stroke-width="2.5" />

  <!-- Central Cyber Eye / Core Beacon -->
  <circle cx="256" cy="245" r="18" fill="#ffffff" stroke="#22d3ee" stroke-width="3" />
  <circle cx="256" cy="245" r="9" fill="#0284c7" />

  <!-- Satellite Neural Nodes (Defence Swarms) -->
  <circle cx="160" cy="195" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="352" cy="195" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="186" cy="325" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="326" cy="325" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="256" cy="125" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="256" cy="380" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />

  <!-- Lower Tactical Chevron Highlights -->
  <polyline points="146,305 256,450 366,305" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round" />
</svg>